name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let a queued deploy wait for the running one instead of cancelling it, so the
# published site always matches the newest commit that finished building.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # The build lands next to the sources at the repo root, so stage only the
      # files Pages should serve rather than shipping src/ and node_modules/.
      - name: Stage site
        run: |
          mkdir -p _site
          cp -R index.html 404.html CNAME build assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
